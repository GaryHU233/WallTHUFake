<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2f86">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 · WallTHU</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body class="admin-body">
  <!-- 登录 -->
  <div class="login-wrap" id="login-view" hidden>
    <div class="login-card">
      <a class="logo" href="/">
        <img class="logo-img" src="/img/logo.png" alt="">
        <span class="logo-text"><b>WallTHU</b><small>管理后台</small></span>
      </a>
      <h1>管理员登录</h1>
      <p>仅限运营团队使用</p>
      <form id="login-form">
        <div class="field">
          <input class="input" type="password" name="password" placeholder="管理员密码"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">登录</button>
      </form>
      <div class="notice" style="margin-top:16px">
        <span>🔒</span>
        <span>连续输错 8 次将锁定 10 分钟。登录状态保持 12 小时。</span>
      </div>
    </div>
  </div>

  <!-- 后台 -->
  <header class="admin-header" id="admin-header" hidden>
    <div class="admin-header-inner">
      <a class="logo" href="/">
        <img class="logo-img" src="/img/logo.png" alt="">
        <span class="logo-text"><b>WallTHU</b><small>管理后台</small></span>
      </a>
      <span class="admin-tag">ADMIN</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色模式">🌙</button>
      <a class="btn btn-sm" href="/" target="_blank" rel="noopener">查看前台 ↗</a>
      <button class="btn btn-sm btn-ghost" id="logout-btn" type="button">退出</button>
    </div>
  </header>

  <main class="admin-main container-wide" id="admin-main" hidden>
    <div class="admin-grid" id="admin-stats"></div>

    <nav class="tabs" id="admin-tabs" aria-label="管理功能">
      <button class="tab active" data-tab="all" type="button">全部帖子</button>
      <button class="tab" data-tab="approved" type="button">已发布</button>
      <button class="tab" data-tab="deleted" type="button">已删除</button>
      <button class="tab" data-tab="comments" type="button">评论</button>
      <button class="tab" data-tab="reports" type="button">举报 <span class="pill" id="pill-reports" hidden>0</span></button>
      <button class="tab" data-tab="appeals" type="button">申诉 <span class="pill" id="pill-appeals" hidden>0</span></button>
      <button class="tab" data-tab="messages" type="button">私信 <span class="pill" id="pill-messages" hidden>0</span></button>
      <button class="tab" data-tab="bans" type="button">封禁</button>
      <button class="tab" data-tab="stats" type="button">数据统计</button>
    </nav>

    <div class="admin-toolbar" id="admin-toolbar"></div>
    <div id="admin-list"></div>
    <button class="load-more" id="admin-more" type="button" hidden>加载更多</button>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
